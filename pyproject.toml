[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-ideas"
version = "0.1.0"
description = "A unified launcher and catalog for the Daily Ideas terminal app collection"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Daily Ideas contributors"}]
dependencies = []

[project.scripts]
daily-ideas = "daily_ideas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daily_ideas = ["apps.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
